[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
readme = "README.md"
keywords = ["uptimescout", "availability", "status-api", "monitoring", "mcp"]
name="uptimescout-mcp"
version="0.1.4"
description="UptimeScout MCP stdio bridge and client configuration"
requires-python=">=3.10"
license="MIT"
[project.scripts]
uptimescout-mcp="uptimescout_mcp:main"

[project.urls]
Homepage = "https://uptimescout.com"
Documentation = "https://github.com/jsonscraper/uptimescout-mcp-server/blob/main/docs/guide.md"
Repository = "https://github.com/jsonscraper/uptimescout-mcp-server"
Issues = "https://github.com/jsonscraper/uptimescout-mcp-server/issues"
